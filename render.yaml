services:
  # ── Backend Service (FastAPI) ────────────────────────────────────────────────
  - type: web
    name: reliefai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        # Allow the frontend service to access the backend CORS
        value: "*"
      # The following must be filled out in the Render Dashboard after deployment
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: "relieflink-ai"

  # ── Frontend Service (Streamlit) ──────────────────────────────────────────────
  - type: web
    name: reliefai-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Extract host from backend service and inject as a full HTTPS URL
      - key: BACKEND_HOST
        fromService:
          type: web
          name: reliefai-backend
          property: host
      - key: BACKEND_URL
        value: https://${BACKEND_HOST}
